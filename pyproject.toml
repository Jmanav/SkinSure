[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinsure"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "timm",
    "pillow",
    "numpy",
    "opencv-python",
    "anthropic",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-socket", "ruff", "httpx"]
federated = ["flwr[simulation]>=1.12", "scikit-learn"]
# Tracing is OPTIONAL on purpose: a clinical API must boot and serve without a telemetry
# stack installed, and src/observability/tracing.py degrades to a no-op when these are
# absent (verified by test, and by importing it with opentelemetry blocked).
# Pinned exactly because every gen_ai.* attribute is at semconv stability "Development":
# names may be renamed or removed in any minor release with no deprecation period.
observability = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    # proto-http, not gRPC: fewer native deps, and Langfuse accepts OTLP/HTTP only.
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
# Block network access in every test run. The suite's invariant is that unit and
# integration tests never reach a real API -- the LLM client is always injected as a
# fake -- and this enforces it instead of trusting it. A test that genuinely needs
# the network must say so with the `enable_socket` marker; there are none today.
#
# 127.0.0.1 is allowed because asyncio's event loop needs it, not because any test
# talks to a local server. On Windows, ProactorEventLoop's self-pipe calls
# socket.socketpair(), and with no AF_UNIX available CPython falls back to a
# loopback AF_INET pair -- so every asyncio.run() and every FastAPI TestClient call
# would otherwise fail (TestClient drives the ASGI app through a loop, so it is the
# same cause, not a second one). --allow-unix-socket looks like the fix and is not:
# the problem is precisely that no Unix socket is available to fall back to.
# Egress is still blocked: connect() to any other host raises
# SocketConnectBlockedError, verified against a real address and through httpx.
#
# One limit: the guard hooks socket creation and connect(), not name resolution, so
# getaddrinfo() still succeeds. A test cannot reach the network, but DNS is not a
# sealed boundary -- this enforces "no API calls", not "no packets".
addopts = "--disable-socket --allow-hosts=127.0.0.1"
